      The 96th Academy Awards ceremony, which was presented by the Academy of Motion Picture Arts and Sciences (AMPAS), took place on March 10, 2024, at the Dolby Theatre in Hollywood, Los Angeles.[1] During the gala, the AMPAS presented Academy Awards (commonly referred to as Oscars) in 23 categories honoring films released in 2023. Comedian Jimmy Kimmel hosted the show for the fourth time.The nominations were announced on January 23, 2024. Oppenheimer led with 13 nominations, followed by Poor Things and Killers of the Flower Moon with 11 and 10, respectively.[2][3][4] Oppenheimer won a leading seven awards, including Best Picture and Best Director.[5] Other major winners were Poor Things with four awards and The Zone of Interest with two. The films which won one award each include American Fiction, Anatomy of a Fall, Barbie, The Boy and the Heron, Godzilla Minus One, The Holdovers, The Last Repair Shop, 20 Days in Mariupol, War Is Over!, and The Wonderful Story of Henry Sugar. The telecast drew 19.5 million viewers in the United States, becoming the most watched awards show since 2020.[6]The Academy held its 14th annual Governors Awards ceremony, hosted by John Mulaney, at the Ray Dolby Ballroom at Ovation Hollywood on January 9, 2024.[7] The Academy Scientific and Technical Awards were presented by host Natasha Lyonne on February 23, 2024, at the Academy Museum of Motion Pictures in Los Angeles.[8]
