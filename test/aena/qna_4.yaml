  - context: |
      Cambios en la estructura corporativa para adaptarse al Plan Estratégico. El Consejo de Administración del 27 de febrero aprobó la adjudicación del concurso para la renovación de la oferta de restauración del Aeropuerto Adolfo Suárez Madrid-Barajas. Aena gana 133,6 millones de euros en el primer trimestre de 2023 y las ventas comerciales mejoran en más del 12% respecto a la actividad prepandemia. Elegidas las ideas ganadoras de las cuarta edición de los Premios. El Aeropuerto Federico García Lorca Granada-Jaén finaliza la obra de reforma y ampliación del edificio terminal. 
      Nace la Alianza para la Sostenibilidad del Transporte Aéreo, que une al sector empresarial, académico y del tercer sector para dar respuesta al reto de la sostenibilidad ambiental, económica y social de la aviación.Aena, crea un distintivo para identificar a las personas con discapacidades invisibles.
      Aena, premiada por la Universidad Autónoma de Madrid, por su contribución a la formación y el aprendizaje de los estudiantes de la misma. Aena entrega sus cuartos premios de innovación interna.
      Tras la aprobación por la Junta General de Accionistas de la propuesta de distribución del beneficio neto del ejercicio 2022 de Aena S.M.E., S.A., el 4 de mayo de 2023 se pagó el dividendo propuesto de 712,5 millones de euros (en el periodo de seis meses terminado el 30 de junio de 2022 no se distribuyeron dividendos).
      El 30 de mayo de 2023 el Consejo de Administración de Aena aprobó la adjudicación de la gestión de las tiendas libres de impuestos de 23 aeropuertos, correspondientes a los lotes de: AndalucíaMediterráneo, Canarias, Baleares y Aeropuertos del Norte.
      Nueva estrategia de acreditación Airport Carbon Accreditation con 19 aeropuertos en nivel 4+ en 2026 y nivel 5 en 2030. Certificación en 2023 del nivel 3 (Optimización) del programa Airport Carbon Accreditation de ACI EU en los 4 principales aeropuertos de la red, AS Madrid Barajas, JT BarcelonaEl Prat, Málaga-Costa del Sol y Palma de Mallorca.
    questions_and_answers:
      - question: |
          ¿Qué decisión tomó el Consejo de Administración de Aena el 27 de febrero con respecto a la oferta de restauración en el Aeropuerto Adolfo Suárez Madrid-Barajas?
        answer: |
          El Consejo de Administración aprobó la adjudicación del concurso para la renovación de la oferta de restauración del Aeropuerto Adolfo Suárez Madrid-Barajas.
      - question: |
          ¿Cuánto ganó Aena en el primer trimestre de 2023 y cómo evolucionaron las ventas comerciales en comparación con la etapa prepandemia?
        answer: |
          Aena ganó 133,6 millones de euros en el primer trimestre de 2023 y las ventas comerciales mejoraron en más del 12% respecto a la actividad prepandemia.
      - question: |
          ¿Cuánto fue el dividendo distribuido por Aena en mayo de 2023 y que pasó en 2022?
        answer: |
          Aena distribuyó un dividendo de 712,5 millones de euros el 4 de mayo de 2023, tras la aprobación por la Junta General de Accionistas. En el período de seis meses terminado el 30 de junio de 2022 no se distribuyeron dividendos.
      - question: |
          ¿Qué decisión tomó el Consejo de Administración de Aena el 30 de mayo de 2023 con respecto a las tiendas libres de impuestos?
        answer: |
          El Consejo de Administración de Aena aprobó la adjudicación de la gestión de las tiendas libres de impuestos en 23 aeropuertos, organizados en los lotes de Andalucía-Mediterráneo, Canarias, Baleares y Aeropuertos del Norte.
      - question: |
          ¿Cuáles fueron los principales aeropuertos de la red de Aena que obtuvieron la certificación de nivel 3 del programa Airport Carbon Accreditation en 2023?
        answer: |
          Los principales aeropuertos de la red de Aena que obtuvieron la certificación de nivel 3 (Optimización) en 2023 fueron el Aeropuerto Adolfo Suárez Madrid-Barajas, el Aeropuerto Josep Tarradellas Barcelona-El Prat, el Aeropuerto de Málaga-Costa del Sol y el Aeropuerto de Palma de Mallorca.    
  - context: |
      La estrategia del negocio aeronáutico persigue tres objetivos:
      Contribuir a incrementar los volúmenes de tráfico definidos en el DORA II.
      Mantener la posición de liderazgo en eficiencia operativa, alcanzando los niveles exigidos de seguridad y calidad.
      Garantizar que las infraestructuras tengan la capacidad suficiente para acomodar la demanda aérea futura.
      Para dar cumplimiento a estos objetivos, el Plan Estratégico prevé una inversión total en España en el periodo 2022-2026 superior a 2.916 M€, con un promedio anual de 583 M€.
      Si bien, en el Plan Estratégico preveía situar la recuperación de los niveles previos a la COVID-19 en el año 2024, el año 2023 ha cerrado un nuevo récord histórico de pasajeros para el Grupo Aena, más de 314,1 millones, un 16,0% más que en 2022. Además, ha gestionado 2.674,8 miles de movimientos de aeronaves, un 8,3% más que en 2022; se han movido 1.165.608,7 toneladas de mercancía, un 5,6% más que el año pasado.
      Cara a los próximos ejercicios, el Plan contempla:
      Desaparición en 2025 de los límites tarifarios.
      Establecimiento de bases del crecimiento de la capacidad que será muy relevante para el DORA III y que ampliará la base de activos regulados.
      Incorporación de cambios estructurales en la base de costes que permitirá a Aena seguir siendo líder en eficiencia operativa.
      Disposición de medidas energéticas alternativas para garantizar la reducción de costes por este motivo.
    questions_and_answers:
      - question: |
          ¿Cuáles son los tres objetivos principales de la estrategia del negocio aeronáutico de Aena?
        answer: |
          Los tres objetivos principales de la estrategia del negocio aeronáutico son:
          1. Contribuir a incrementar los volúmenes de tráfico definidos en el DORA II.
          2. Mantener la posición de liderazgo en eficiencia operativa, alcanzando los niveles exigidos de seguridad y calidad.
          3. Garantizar que las infraestructuras tengan la capacidad suficiente para acomodar la demanda aérea futura.
      - question: |
          ¿Cuál es la inversión total prevista por Aena en el Plan Estratégico 2022-2026 para España y cuál es su promedio anual?
        answer: |
          El Plan Estratégico 2022-2026 prevé una inversión total en España superior a 2.916 millones de euros, con un promedio anual de 583 millones de euros.
      - question: |
          ¿Cuántos pasajeros gestionó el Grupo Aena en 2023 y qué récord logró?
        answer: |
          En 2023, el Grupo Aena gestionó más de 314,1 millones de pasajeros, alcanzando un nuevo récord histórico y un incremento del 16,0% respecto a 2022.
      - question: |
          ¿Cómo evolucionaron los movimientos de aeronaves y la carga transportada en 2023 en comparación con 2022 en la red Aena?
        answer: |
          En 2023, Aena gestionó 2.674,8 miles de movimientos de aeronaves, un 8,3% más que en 2022, y transportó 1.165.608,7 toneladas de mercancía, un 5,6% más que el año anterior.
      - question: |
          ¿Qué cambios contempla el Plan Estratégico de Aena para los próximos años?
        answer: |
          El Plan Estratégico contempla los siguientes cambios para los próximos años:
          1. Desaparición de los límites tarifarios en 2025.
          2. Establecimiento de bases para el crecimiento de la capacidad en el DORA III.
          3. Incorporación de cambios estructurales en la base de costes para mantener el liderazgo en eficiencia operativa.
          4. Implementación de medidas energéticas alternativas para reducir costes.
