    questions_and_answers:
      - question: |
          ¿Cuántos empleados tiene Aena y qué porcentaje de contratos son fijos?
        answer: |
          Aena cuenta con un total de 10.111 empleados, de los cuales el 90% tiene contratos fijos, asegurando estabilidad laboral y condiciones de empleo de calidad.
      - question: |
          ¿Qué medidas promueve Aena para fomentar la diversidad e inclusión en el entorno laboral?
        answer: |
          Aena impulsa la diversidad e inclusión a través de varias iniciativas, incluyendo:
          - Diversidad de género: Las mujeres representan el 37,7% de la plantilla y el 50% del Consejo de Administración.
          - II Plan de Igualdad: Programa destinado a reducir desigualdades de género y fomentar la equidad.
          - Diversidad generacional: Participación en ferias de empleo y colaboración con universidades para impulsar la inserción de jóvenes en el mercado laboral.
      - question: |
          ¿Qué porcentaje de empleados en Aena trabaja a jornada completa?
        answer: |
          El 95% de los empleados de Aena realiza su trabajo a jornada completa, reflejando su compromiso con la estabilidad laboral y la empleabilidad de calidad.
      - question: |
          ¿Qué políticas de flexibilidad laboral ha implementado Aena?
        answer: |
          Aena ha implementado políticas para mejorar la conciliación y flexibilidad laboral, tales como:
          - Política de Teletrabajo, que permite a los empleados trabajar de forma remota en ciertas condiciones.
          - Política de Desconexión Digital, asegurando que los trabajadores puedan desconectarse fuera del horario laboral.
          - Organización del tiempo de trabajo, fomentando la eficiencia y el bienestar de los empleados.
      - question: |
          ¿Qué porcentaje de la plantilla de Aena está compuesta por mujeres?
        answer: |
          Las mujeres representan el 37,7% de la plantilla de Aena y ocupan el 50% de los puestos en el Consejo de Administración, demostrando el compromiso de la empresa con la igualdad de género y la diversidad en su estructura organizativa.
document_outline: |
  Este documento muestra el Informe de Sostenibilidad del Aena en 2023. En el informe se muestra información económica y financiera, Informe de sostenibilidad con los modelos de gobierno sostenible, compromiso con la sociedad y Derechos Humanos o Innovación. Por último hay un innorme anual del Gobierno Corporativo (IAGC) y un informe anual sobre las Remuneraciones de los Consejeros (IARC)
