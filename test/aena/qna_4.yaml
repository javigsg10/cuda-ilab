  - context: |
      Para acreditar la solvencia técnica, dentro de los criterios de adjudicación de los pliegos se pueden incorporar criterios cualitativos con consideraciones de tipo medioambiental o social. Por ejemplo:
      Ámbito medioambiental: la experiencia o desempeño en este sentido se puede acreditar mediante la solicitud de certificados de gestión a las empresas licitadoras certificado de implantación del Sistema de Gestión Ambiental o del Sistema de Gestión de Calidad (ISO 4001, ISO 9001 o similar)- o emitido u homologado por una entidad acreditada a tal efecto por la legislación española o comunitaria-. En la contratación acreditada a tal efecto por la legislación española o comunitaria-. En la contratación comercial los pliegos técnicos de arrendamientos especifican que, en caso de la ejecución de obras, se deben incluir, entre otros aspectos, el seguimiento de procedimiento medioambiental, para lo que se presentará el Plan de Vigilancia Ambiental debidamente cumplimentado en el pliego del proyecto.
      Asuntos sociales : en algunos pliegos de suministros se puede requerir la garantía de cumplimiento de las Convenciones fundamentales de la Organización Internacional del Trabajo mediante declaración de compromiso de aplicación de los sistemas de gestión de la cadena de suministro. Asimismo, tanto en los pliegos de obras como de servicio y suministro se puede solicitar como criterio de solvencia técnica declaración mediante compromiso de los títulos académicos y profesionales del empresario y de los directivos de la empresa exigidos en los pliegos y, en particular, del responsable o responsables de la ejecución del contrato, así como de los técnicos encargados directamente de la misma.
      Este tipo de prácticas también se realizan en Reino Unido y Brasil, como parte de sus procesos de selección.
      En el Aeropuerto de Londres-Luton, en Reino Unido, los pliegos de contratación tienen incluidos requerimientos de solvencia técnica en materia social y ambiental, que deben ser acreditados mediante certificaciones, referencias, etc. Tras recibir estas acreditaciones, se someterá a los proveedores a un análisis y evaluación.
      En los aeropuertos de Aena en Brasil se dispone  del Patrón de Cláusulas Administrativas Particulares ('PCAP'), el cual describe los requisitos legales y de solvencia económica que los proveedores deben cumplir. Estos están determinados por el área solicitante. Por ejemplo, algunos aspectos que se solicitan son aquellos relacionados con materia ESG. Como consecuencia, estos deberán acreditar su capacidad técnica para participar en el proceso de licitación y consecuente adjudicación. Adicionalmente, se desarrolla un proceso de homologación ( background check ) de las prácticas y registros del proveedor, mediante el cual se analizan registros y desempeño previo (posibles demandas por motivos de corrupción, prácticas de esclavitud, o incumplimiento de obligaciones laborales (materializadas en un número alto de procesos y condenas, etc). Finalmente, se lleva a cabo el proceso de movilización, mediante el que se verifica si los vínculos laborales entre empresario y trabajador son regulares y dan cumplimiento a la legislación vigente.
    questions_and_answers:
      - question: |
          ¿Cómo pueden las empresas licitadoras acreditar su experiencia en el ámbito medioambiental en un pliego con Aena?
        answer: |
          Los pliegos de adjudicación pueden incluir criterios cualitativos en dos ámbitos principales:
          Medioambiental: Se pueden solicitar certificados de gestión ambiental o de calidad, como ISO 14001 o ISO 9001, emitidos por una entidad acreditada por la legislación española o comunitaria.
          Social: Se puede requerir la garantía de cumplimiento de las Convenciones fundamentales de la OIT mediante una declaración de compromiso en la gestión de la cadena de suministro.
      - question: |
          ¿Qué requisitos medioambientales deben cumplir los arrendamientos comerciales que impliquen ejecución de obras en la red Aena?
        answer: |
          Los pliegos técnicos de arrendamientos comerciales especifican que, en caso de ejecución de obras, se debe incluir un seguimiento de procedimiento medioambiental mediante la presentación del Plan de Vigilancia Ambiental debidamente cumplimentado en el pliego del proyecto.
      - question: |
          ¿En qué países, además de España, se aplican criterios de solvencia técnica en materia social y ambiental en los procesos de selección de Aena?
        answer: |
          Además de España, estos criterios de solvencia técnica en materia social y ambiental se aplican en Reino Unido, en el Aeropuerto de Londres-Luton y Brasil.
      - question: |
          ¿Qué documento regula los requisitos legales y de solvencia económica de los proveedores en los aeropuertos de Aena en Brasil?
        answer: |
          En los aeropuertos de Aena en Brasil, el Patrón de Cláusulas Administrativas Particulares (PCAP) regula los requisitos de solvencia económica y legal de los proveedores. Este documento establece:
          1. Criterios ESG (ambientales, sociales y de gobernanza) que deben cumplirse.
          2. Procedimientos de verificación de antecedentes financieros y legales.
          3. Evaluaciones de cumplimiento normativo y desempeño previo de los proveedores.
      - question: |
          ¿Cómo se garantiza la solvencia técnica en el Aeropuerto de Londres-Luton?
        answer: |
          En el Aeropuerto de Londres-Luton, la solvencia técnica se garantiza mediante:
          1. Incorporación de requisitos sociales y ambientales en los pliegos de contratación.
          2. Solicitud de certificaciones y referencias para acreditar el cumplimiento de estos requisitos.
          3. Evaluación de los proveedores tras la recepción de la documentación, asegurando que cumplen con las normativas y estándares exigidos.
