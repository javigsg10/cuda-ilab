seed_examples:
  - context: |
      **Asegurado**: Persona física o jurídica, titular del interés objeto del seguro y que, en
      defecto del Tomador, asume las obligaciones derivadas del contrato. La condición de
      Asegurado se amplía a su cónyuge o quien ostente esta condición, los hijos de ambos o 
      de cualquiera de ellos que convivan con ellos o familiares hasta tercer grado de 
      consanguinidad que convivan con él y no tengan otro domicilio legal. No se pierde la 
      condición de Asegurado por el hecho de vivir temporalmente fuera del domicilio del 
      Tomador por razones de salud o estudios. **Asegurador**: Zurich Insurance Europe AG, 
      Sucursal en España. **Arrendatario o inquilino**: Persona física que, a cambio de un precio 
      al que se denomina renta, disfruta del uso de la vivienda sobre la que se concierta el 
      riesgo objeto de este contrato de seguro. **Beneficiario**: Persona a quien el Tomador 
      del seguro, o, en su caso, el Asegurado, reconoce el derecho a percibir, en la cuantía 
      que corresponda, la indemnización derivada de esta póliza. **Tercero** Cualquier persona 
      física o jurídica distinta de el Tomador del seguro o el Asegurado; los cónyuges, 
      ascendientes, descendientes, así como familiares del Tomador del seguro y/o Asegurado, 
      que convivan con ellos; o los socios, directivos, asalariados y personas que, de hecho o 
      de derecho, dependan del Tomador del seguro y/o Asegurado, mientras actúen en el ámbito 
      de dicha dependencia. **Tomador del seguro**: La persona física o jurídica que, con la 
      Compañía, suscribe este contrato en nombre propio y al que corresponden las obligaciones 
      que de él deriven, salvo que por su naturaleza deban ser cumplidas por el Asegurado. 
      **Seguro a primer riesgo**: Forma de aseguramiento por la que se garantiza una cantidad 
      determinada, hasta la cual queda cubierto el riesgo con independencia del valor total, 
      sin aplicación de la regla proporcional.
      **Seguro a valor total**: Forma de aseguramiento que exige que el valor asegurado en la
      póliza coincida con el valor total del objeto garantizado.
      **Desocupación**: Periodo transitorio en el cual el Asegurado no pernocta en la vivienda
      asegurada.
      **Condiciones Particulares**: Documento contractual en el que se reflejan los capitales y
      coberturas objeto del seguro y cuya aplicación se delimita en estas condiciones gene-
      rales.
    questions_and_answers:
      - question: |
          ¿Qué es un Asegurado?
        answer: |
          Es la persona física o jurídica, titular del interés objeto del seguro y que, en
          defecto del Tomador, asume las obligaciones derivadas del contrato. La condición de
          Asegurado se amplía a su cónyuge o quien ostente esta condición, los hijos de ambos o 
          de cualquiera de ellos que convivan con ellos o familiares hasta tercer grado de 
          consanguinidad que convivan con él y no tengan otro domicilio legal. No se pierde la 
          condición de Asegurado por el hecho de vivir temporalmente fuera del domicilio del 
          Tomador por razones de salud o estudios.
      - question: |
          ¿Qué es un Beneficiado?
        answer: |
          Es la persona a quien el Tomador del seguro, o, en su caso, el Asegurado, reconoce el 
          derecho a percibir, en la cuantía que corresponda, la indemnización derivada de esta 
          póliza.
      - question: |
          ¿Quién es el Tomador del seguro?
        answer: |
          Es la persona física o jurídica que, con la Compañía, suscribe este contrato en nombre 
          propio y al que corresponden las obligaciones que de él deriven, salvo que por su 
          naturaleza deban ser cumplidas por el Asegurado.
      - question: |
          ¿Quién es el Arrendatario o inquilino?
        answer: |
          Es la Persona física que, a cambio de un precio al que se denomina renta, disfruta del 
          uso de la vivienda sobre la que se concierta el riesgo objeto de este contrato de seguro.
      - question: |
          ¿Qué es el Seguro a primer riesgo?
        answer: |
          Es la forma de aseguramiento por la que se garantiza una cantidad determinada, hasta la 
          cual queda cubierto el riesgo con independencia del valor total, sin aplicación de la 
          regla proporcional.
